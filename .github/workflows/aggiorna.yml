name: Aggiorna dati e mappa

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica i dati BDSR del Ministero del Turismo
        run: python scripts/fetch_bdsr.py

      - name: Scarica residenti e abitazioni ISTAT (una volta al mese)
        continue-on-error: true
        run: python scripts/fetch_istat.py

      - name: Prepara i file della mappa
        run: python scripts/build_site.py

      - name: Salva lo storico nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Dati BDSR del $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
